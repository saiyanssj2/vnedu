<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>VnEdu Nhận Xét AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      min-width: 180px;
      transition: width 0.3s;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f5f7fa;
      color: #1a1a2e;
    }

    header {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: white;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    header span { font-size: 11px; opacity: 0.8; }

    .main { padding: 12px; }

    .action-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .subject-info {
      font-size: 12px;
      color: #555;
      background: #e8f0fe;
      padding: 5px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      min-height: 26px;
    }

    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #1565c0, #0d47a1); color: white; }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }
    .btn-success { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; }
    .btn-success:hover:not(:disabled) { opacity: 0.9; }
    .btn-secondary { background: #e8f0fe; color: #1565c0; }
    .btn-secondary:hover:not(:disabled) { background: #d2e3fc; }

    .options-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #555;
    }

    #progress {
      display: none;
      font-size: 12px;
      color: #1565c0;
      background: #e8f0fe;
      padding: 7px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    #student-list {
      max-height: 340px;
      overflow-y: auto;
      border: 1px solid #dde3ed;
      border-radius: 6px;
      background: white;
    }

    .student-row {
      padding: 8px 10px;
      border-bottom: 1px solid #f0f4f8;
      transition: background 0.15s;
    }
    .student-row:last-child { border-bottom: none; }
    .student-row.done { background: #f1f8e9; }

    .student-name { font-weight: 600; font-size: 13px; }
    .student-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 3px;
      flex-wrap: wrap;
    }

    .xl-badge, .badge-existing, .badge-done {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .xl-badge { background: #e3f2fd; color: #1565c0; }
    .badge-existing { background: #fff3e0; color: #e65100; }
    .badge-done { background: #e8f5e9; color: #2e7d32; }

    .preview-text {
      font-size: 11px;
      color: #444;
      margin-top: 5px;
      padding: 5px 8px;
      background: #f8f9fa;
      border-left: 3px solid #1565c0;
      border-radius: 0 4px 4px 0;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #aaa;
      font-size: 12px;
    }

    /* Thống kê sổ CN */
    #thongke-preview {
      display: none;
      background: white;
      border: 1px solid #dde3ed;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      max-height: 380px;
      overflow-y: auto;
    }

    #thongke-guide {
      display: none;
      margin-top: 10px;
      padding: 8px;
      background: #e8f5e9;
      border-radius: 6px;
      font-size: 11px;
      color: #2e7d32;
      line-height: 1.6;
    }

    .toast {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: #323232; color: white; padding: 6px 16px;
      border-radius: 20px; font-size: 12px; opacity: 0;
      transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📝 VnEdu Nhận Xét AI</h1>
    <span id="page-label">Đang nhận diện trang...</span>
  </div>
  <button class="btn btn-secondary" id="btn-reload" style="margin-left:auto">🔄</button>
</header>

<div class="main">

  <!-- Panel: Nhận xét -->
  <div id="panel-nhanxet" style="display:none">
    <div class="action-bar">
      <button class="btn btn-primary" id="btn-generate-all" disabled>✨ Sinh nhận xét</button>
      <button class="btn btn-success" id="btn-fill-all" disabled>⬇️ Điền vào trang</button>
    </div>
    <div class="subject-info" id="subject-info"></div>
    <div class="options-row">
      <input type="checkbox" id="chk-only-empty" checked />
      <label for="chk-only-empty" style="text-transform:none; font-size:12px; margin:0">Chỉ sinh cho ô chưa có nhận xét</label>
    </div>
    <div id="progress"></div>
    <div id="student-list"></div>
  </div>

  <!-- Panel: Sổ chủ nhiệm -->
  <div id="panel-chunhiem" style="display:none">
    <div class="action-bar">
      <button class="btn btn-success" id="btn-fill-chunhiem" disabled>⬇️ Điền Sổ CN</button>
    </div>
    <div class="subject-info" id="tongket-info"></div>
    <div id="thongke-preview"><div id="thongke-content"></div></div>
    <div id="thongke-guide">✅ Đã tính xong. Mở trang <b>"Quản lý sổ chủ nhiệm"</b> rồi bấm <b>Điền Sổ CN</b>.</div>
  </div>

  <!-- Panel: không nhận diện được -->
  <div id="panel-unknown">
    <div class="empty-state">Mở trang <b>Sổ nhận xét</b> hoặc <b>Điểm tổng kết</b> trên vnEdu</div>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
