<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>VnEdu Nhận Xét AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f5f7fa;
      color: #1a1a2e;
    }

    header {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 { font-size: 15px; font-weight: 600; }
    header span { font-size: 11px; opacity: 0.8; }

    .tabs {
      display: flex;
      background: white;
      border-bottom: 2px solid #e3e8f0;
    }

    .tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      color: #666;
      border: none;
      background: none;
      transition: all 0.2s;
    }

    .tab.active {
      color: #1565c0;
      border-bottom: 2px solid #1565c0;
      font-weight: 600;
      margin-bottom: -2px;
    }

    .panel { display: none; padding: 14px; }
    .panel.active { display: block; }

    .form-group { margin-bottom: 10px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    input, select, textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #dde3ed;
      border-radius: 6px;
      font-size: 13px;
      background: white;
      color: #1a1a2e;
      transition: border 0.2s;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1565c0;
    }

    textarea { resize: vertical; min-height: 60px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: white;
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: #e8f0fe;
      color: #1565c0;
      margin-top: 8px;
    }

    .btn-secondary:hover { background: #d2e3fc; }

    .btn-success {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: white;
      margin-top: 8px;
    }

    .btn-success:hover { opacity: 0.9; }
    .btn-success:disabled { opacity: 0.4; cursor: not-allowed; }

    .result-box {
      background: white;
      border: 1px solid #dde3ed;
      border-radius: 6px;
      padding: 10px;
      min-height: 80px;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      white-space: pre-wrap;
      margin-top: 10px;
    }

    .result-box.empty { color: #aaa; font-style: italic; }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 10px;
      color: #1565c0;
      font-size: 12px;
    }

    .loading.show { display: block; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e3e8f0;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: white;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }

    /* Settings tab */
    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-top: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }

    .dot.ok { background: #4caf50; }
    .dot.err { background: #f44336; }

    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    .hint a { color: #1565c0; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📝 VnEdu Nhận Xét AI</h1>
    <span>Sinh nhận xét học sinh tự động</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="generate">✨ Sinh nhận xét</button>
  <button class="tab" data-tab="settings">⚙️ Cài đặt</button>
</div>

<!-- TAB: GENERATE -->
<div class="panel active" id="tab-generate">

  <div class="row">
    <div class="form-group">
      <label>Họ tên học sinh</label>
      <input type="text" id="name" placeholder="Nguyễn Văn A" />
    </div>
    <div class="form-group">
      <label>Giới tính</label>
      <select id="gender">
        <option value="nam">Nam</option>
        <option value="nữ">Nữ</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Môn học</label>
      <select id="subject">
        <option value="Toán">Toán</option>
        <option value="Văn">Ngữ Văn</option>
        <option value="Anh">Tiếng Anh</option>
        <option value="Lý">Vật Lý</option>
        <option value="Hóa">Hóa Học</option>
        <option value="Sinh">Sinh Học</option>
        <option value="Sử">Lịch Sử</option>
        <option value="Địa">Địa Lý</option>
        <option value="GDCD">GDCD</option>
        <option value="Tin">Tin Học</option>
        <option value="Thể dục">Thể Dục</option>
        <option value="Tổng hợp">Tổng hợp</option>
      </select>
    </div>
    <div class="form-group">
      <label>Cấp học</label>
      <select id="level">
        <option value="Tiểu học">Tiểu học</option>
        <option value="THCS">THCS</option>
        <option value="THPT">THPT</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Học lực</label>
      <select id="academic">
        <option value="Xuất sắc">Xuất sắc</option>
        <option value="Giỏi">Giỏi</option>
        <option value="Khá" selected>Khá</option>
        <option value="Trung bình">Trung bình</option>
        <option value="Yếu">Yếu</option>
      </select>
    </div>
    <div class="form-group">
      <label>Hạnh kiểm</label>
      <select id="conduct">
        <option value="Tốt" selected>Tốt</option>
        <option value="Khá">Khá</option>
        <option value="Trung bình">Trung bình</option>
        <option value="Yếu">Yếu</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Điểm mạnh</label>
      <textarea id="strengths" placeholder="chăm chỉ, tích cực..." rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Điểm yếu</label>
      <textarea id="weaknesses" placeholder="còn thiếu tập trung..." rows="2"></textarea>
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Phong cách</label>
      <select id="tone">
        <option value="tích cực, khích lệ">Tích cực</option>
        <option value="nghiêm túc, chuyên nghiệp">Nghiêm túc</option>
        <option value="thân thiện, gần gũi">Thân thiện</option>
        <option value="ngắn gọn, súc tích">Ngắn gọn</option>
      </select>
    </div>
    <div class="form-group">
      <label>Độ dài</label>
      <select id="length">
        <option value="2-3 câu">Ngắn (2-3 câu)</option>
        <option value="4-5 câu" selected>Vừa (4-5 câu)</option>
        <option value="6-8 câu">Dài (6-8 câu)</option>
      </select>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-generate">✨ Sinh nhận xét</button>

  <div class="loading" id="loading">
    <span class="spinner"></span> Đang sinh nhận xét...
  </div>

  <div class="result-box empty" id="result">Nhận xét sẽ hiển thị ở đây...</div>

  <div class="result-actions" style="margin-top:8px">
    <button class="btn btn-secondary" id="btn-copy" disabled>📋 Copy</button>
    <button class="btn btn-success" id="btn-fill" disabled>⬇️ Điền vào trang</button>
  </div>

</div>

<!-- TAB: SETTINGS -->
<div class="panel" id="tab-settings">

  <div class="form-group">
    <label>Gemini API Key</label>
    <input type="password" id="api-key" placeholder="AIza..." />
    <div class="hint">
      Lấy miễn phí tại <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>
    </div>
    <div class="api-status">
      <div class="dot" id="api-dot"></div>
      <span id="api-status-text">Chưa cài đặt</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-save-key">💾 Lưu API Key</button>

  <div class="form-group" style="margin-top:16px">
    <label>Selector ô nhận xét (tùy chỉnh)</label>
    <input type="text" id="custom-selector" placeholder="textarea, .comment-input, ..." />
    <div class="hint">Để trống để tự động detect. Dùng DevTools F12 để tìm selector.</div>
  </div>

  <button class="btn btn-secondary" id="btn-save-selector">💾 Lưu Selector</button>

</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
